[package]
name = "comet-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
# objc 0.2's macros still probe the historical `cargo-clippy` feature in the
# destination crate. It is intentional and harmless; declare it to rustc's
# cfg checker so ordinary macOS builds stay quiet.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
comet-proto.workspace = true
similar.workspace = true
comet-doc.workspace = true
comet-engine.workspace = true
comet-rpc.workspace = true
comet-update.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
alacritty_terminal.workspace = true
base64 = "0.22"
unicode-segmentation.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
tempfile.workspace = true
